name: ✨ Feature Request
description: Suggest a new feature or improvement
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature!
        
        **Before submitting:**
        • Search [existing feature requests](https://github.com/martinknox-dev/crypto-keyboard/issues?q=label%3Aenhancement) to avoid duplicates
        • One feature per issue (makes tracking easier)
        • Consider privacy implications — we don't add features that compromise security
        
        **Note:** Features requiring network access will NOT be implemented (privacy-first approach).

  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - Encryption / Cryptography
        - Steganography / Encoding
        - Keyboard UI / UX
        - Key Management
        - QR Code Exchange
        - Exchange Mode / Auto-decryption
        - Cover Message Generation
        - Platform Compatibility
        - Security Enhancement
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this feature solve? Why do you need it?
      placeholder: |
        Describe the problem or use case.
        Example: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        Describe your ideal solution.
        Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Any other approaches you've thought about...
    validations:
      required: false

  - type: dropdown
    id: privacy-impact
    attributes:
      label: Privacy Impact
      description: Does this feature require any new permissions or data access?
      options:
        - No new permissions needed
        - May need new permissions (explain below)
        - Requires network access (likely won't be implemented)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples.
      placeholder: Screenshots, links to similar features in other apps, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I searched [existing feature requests](https://github.com/martinknox-dev/crypto-keyboard/issues?q=label%3Aenhancement) and this hasn't been suggested."
          required: true
        - label: "I have read the [Contributing Guidelines](https://github.com/martinknox-dev/crypto-keyboard/blob/main/CONTRIBUTING.md)."
          required: true
        - label: "I understand that features requiring network access will not be implemented."
          required: true
        - label: "I have provided clear details about the feature."
          required: true